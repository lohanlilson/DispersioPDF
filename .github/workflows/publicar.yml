# Quando __version__ (lumenpdf/__init__.py) muda na branch main, gera no Windows o executável, o instalador,
# o patch da versão anterior e o versao.json, e publica tudo como Release "vX.Y.Z".
# O Lumen PDF instalado detecta a nova versão sozinho.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ["lumenpdf/__init__.py", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Conferir versão
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('lumenpdf/__init__.py',encoding='utf-8').read()).group(1))")
          echo "VERSAO=$V" >> $GITHUB_ENV
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "A versão $V já foi publicada — nada a fazer."; echo "publicar=nao" >> $GITHUB_OUTPUT
          else
            echo "Publicando a versão $V"; echo "publicar=sim" >> $GITHUB_OUTPUT
          fi

      - name: Base para o patch (versão anterior publicada)
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "v$VERSAO" ]; then
            P=${PREV#v}
            mkdir -p "releases/$P"
            gh release download "$PREV" -p manifest.json -D "releases/$P" && echo "ANTERIOR=$P" >> $GITHUB_ENV || true
          fi

      - name: Gerar executável, instalador e patch
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        run: |
          if [ -n "$ANTERIOR" ]; then python build.py --publicar --patch-from "$ANTERIOR"; else python build.py --publicar; fi
          ls -la Saida

      - name: Publicar Release
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Saida/LumenPDF-Setup-$VERSAO.exe" Saida/LumenPDF-Setup.exe
          gh release create "v$VERSAO" Saida/*.exe Saida/versao.json Saida/manifest.json \
            --title "Lumen PDF $VERSAO" --notes-file Saida/NOTAS.md --latest

      - name: Instalador com nome fixo na versão já publicada
        if: steps.versao.outputs.publicar == 'nao'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v$VERSAO" --json assets -q '.assets[].name' | grep -qx LumenPDF-Setup.exe; then
            gh release download "v$VERSAO" -p "LumenPDF-Setup-$VERSAO.exe" -D tmp
            cp "tmp/LumenPDF-Setup-$VERSAO.exe" tmp/LumenPDF-Setup.exe
            gh release upload "v$VERSAO" tmp/LumenPDF-Setup.exe --clobber
          fi
