# Quando __version__ (lumenpdf/__init__.py) muda na branch main, gera no Windows o executável, o instalador,
# o patch da versão anterior e o versao.json, e publica tudo como Release "vX.Y.Z".
# O Lumen PDF instalado detecta a nova versão sozinho.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ["lumenpdf/__init__.py", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilador C++ (extensão do Explorador)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Conferir versão
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('lumenpdf/__init__.py',encoding='utf-8').read()).group(1))")
          echo "VERSAO=$V" >> $GITHUB_ENV
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "A versão $V já foi publicada — nada a fazer."; echo "publicar=nao" >> $GITHUB_OUTPUT
          else
            echo "Publicando a versão $V"; echo "publicar=sim" >> $GITHUB_OUTPUT
          fi

      - name: Base para o patch (versão anterior publicada)
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$PREV" ] && [ "$PREV" != "v$VERSAO" ]; then
            P=${PREV#v}
            mkdir -p "releases/$P"
            gh release download "$PREV" -p manifest.json -D "releases/$P" && echo "ANTERIOR=$P" >> $GITHUB_ENV || true
          fi

      - name: Teste de inicialização
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/smoke_test.py
          python tests/features_test.py
          python tests/autoscroll_test.py
          python tests/sharpness_test.py
          python tests/split_test.py
          python tests/novidades_test.py
          python tests/desfazer_test.py
          python tests/ferramentas_test.py
          python tests/versoes_test.py
          python tests/novas_ferramentas_test.py
          python tests/medir_test.py

      - name: Gerar executável, instalador e patch
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          LUMEN_REQUIRE_SHELLEXT: "1"
        run: |
          if [ -n "$ANTERIOR" ]; then python build.py --publicar --patch-from "$ANTERIOR"; else python build.py --publicar; fi
          ls -la Saida

      - name: Autoteste do executável gerado (sem Python instalado)
        if: steps.versao.outputs.publicar == 'sim'
        shell: pwsh
        run: |
          $env:LUMEN_NET_TEST = "1"
          $p = Start-Process -FilePath "dist\LumenPDF\LumenPDF.exe" -ArgumentList "--selftest","selftest.txt" -PassThru; $p.WaitForExit()
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "Autoteste do executável falhou"; exit 1 }

      - name: Teste da extensão do Explorador (miniatura e painel de visualização)
        if: steps.versao.outputs.publicar == 'sim'
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tests/make_shellext_pdf.py teste_shell.pdf
          New-Item -ItemType Directory -Force saida_shell | Out-Null
          & build\shellext\test_shellext.exe (Resolve-Path dist\LumenPDF\LumenShell.dll) (Resolve-Path teste_shell.pdf) (Resolve-Path saida_shell)
          if ($LASTEXITCODE -ne 0) { throw "A extensão do Explorador falhou no teste" }

      - name: Teste da impressão rápida (/p, vários arquivos ao mesmo tempo)
        if: steps.versao.outputs.publicar == 'sim'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = Join-Path $PWD "impressos"; New-Item -ItemType Directory -Force $out | Out-Null
          $env:LUMEN_PRINT_TO_PDF = $out
          $src = Join-Path $PWD "teste_impressao.pdf"
          python -c "import pymupdf; d=pymupdf.open(); [d.new_page().insert_text((72,72),'Pagina %d' % (i+1)) for i in range(3)]; d.save(r'$src')"
          $procs = 1..3 | ForEach-Object { Copy-Item $src "arq$_.pdf"; Start-Process "dist\LumenPDF\LumenPDF.exe" -ArgumentList "/p", (Join-Path $PWD "arq$_.pdf") -PassThru }
          $procs | ForEach-Object { $_.WaitForExit(120000) | Out-Null }
          Start-Sleep 8
          Get-ChildItem $out
          if ((Get-ChildItem $out -Filter *.pdf).Count -ne 3) { throw "A impressão rápida não gerou os 3 arquivos" }
          Get-Process LumenPDF -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Teste de atualização (instala a versão anterior e aplica o patch)
        if: steps.versao.outputs.publicar == 'sim' && env.ANTERIOR != ''
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release download "v$env:ANTERIOR" -p "LumenPDF-Setup-$env:ANTERIOR.exe" -D anterior
          $p = Start-Process "anterior\LumenPDF-Setup-$env:ANTERIOR.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="assocpdf"' -PassThru; $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "Falha ao instalar a versão anterior ($($p.ExitCode))" }
          Start-Sleep 5; Get-Process LumenPDF -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2
          $patch = Join-Path $PWD "Saida\LumenPDF-Atualizacao-$env:ANTERIOR-para-$env:VERSAO.exe"
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{792033AC-5BB3-4C63-8E0C-D8EFE3BA162C}_is1"
          # mesmo caminho da atualização automática: o próprio programa (versão nova) dispara o patch em segundo plano
          $helper = Join-Path $PWD "dist\LumenPDF\LumenPDF.exe"
          Start-Process $helper -ArgumentList "--run-update", "`"$patch`"", "0" | Out-Null
          $v = ""
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2
            $v = (Get-ItemProperty $key).DisplayVersion
            if ($v -eq $env:VERSAO -and -not (Get-Process -Name "LumenPDF-Atualizacao*" -ErrorAction SilentlyContinue)) { break }
          }
          Start-Sleep 5; Get-Process LumenPDF -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Versão instalada após o patch: $v"
          if ($v -ne $env:VERSAO) { throw "Versão esperada $env:VERSAO, encontrada $v" }
          $dll = (Get-ItemProperty "Registry::HKEY_LOCAL_MACHINE\Software\Classes\CLSID\{6E1F4D3A-8C2B-4A57-9B1E-3D5C7A9F0B21}\InprocServer32").'(default)'
          Write-Host "Extensão do Explorador registrada em: $dll"
          if (-not $dll -or -not (Test-Path $dll)) { throw "Extensão do Explorador não registrada após o patch" }
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation "LumenPDF.exe"
          $p = Start-Process $exe -ArgumentList "--selftest","selftest-instalado.txt" -PassThru; $p.WaitForExit()
          Get-Content selftest-instalado.txt
          if ($p.ExitCode -ne 0) { throw "Autoteste do programa atualizado falhou" }

      - name: Publicar Release
        if: steps.versao.outputs.publicar == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "Saida/LumenPDF-Setup-$VERSAO.exe" Saida/LumenPDF-Setup.exe
          gh release create "v$VERSAO" Saida/*.exe Saida/versao.json Saida/manifest.json \
            --title "Lumen PDF $VERSAO" --notes-file Saida/NOTAS.md --latest

      - name: Instalador com nome fixo na versão já publicada
        if: steps.versao.outputs.publicar == 'nao'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v$VERSAO" --json assets -q '.assets[].name' | grep -qx LumenPDF-Setup.exe; then
            gh release download "v$VERSAO" -p "LumenPDF-Setup-$VERSAO.exe" -D tmp
            cp "tmp/LumenPDF-Setup-$VERSAO.exe" tmp/LumenPDF-Setup.exe
            gh release upload "v$VERSAO" tmp/LumenPDF-Setup.exe --clobber
          fi
