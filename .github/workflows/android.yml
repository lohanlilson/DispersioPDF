# App Android: compila, testa no emulador (com capturas de tela) e, quando a versão em
# android/version.properties muda, publica o APK assinado como Release "android-vX.Y.Z".
name: App Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          echo "VERSAO=$V" >> $GITHUB_ENV
          if gh release view "android-v$V" >/dev/null 2>&1; then echo "publicar=nao" >> $GITHUB_OUTPUT; else echo "publicar=sim" >> $GITHUB_OUTPUT; fi

      - name: Conferir certificados ICP-Brasil embutidos
        run: |
          # baixa o pacote oficial do ITI por outra rede e confere que as raízes embutidas no app são as mesmas
          if ! curl -sSf -m 120 -o ac.zip http://acraiz.icpbrasil.gov.br/credenciadas/CertificadosAC-ICP-Brasil/ACcompactado.zip; then
            echo "::warning::Não foi possível baixar o pacote do ITI para conferir"; exit 0
          fi
          mkdir icp && unzip -q ac.zip -d icp
          for f in icp/*; do openssl x509 -in "$f" -inform DER -noout -fingerprint -sha256 2>/dev/null || openssl x509 -in "$f" -noout -fingerprint -sha256; done | sort -u > iti.txt
          awk '/BEGIN/{n++; f="r" n ".pem"} {print > f}' android/app/src/main/assets/icp/raizes.pem
          for f in r*.pem; do openssl x509 -in "$f" -noout -fingerprint -sha256; done | sort -u > app.txt
          cat app.txt
          comm -23 app.txt iti.txt > diferentes.txt
          if [ -s diferentes.txt ]; then echo "::error::Raiz embutida não confere com o ITI"; cat diferentes.txt; exit 1; fi
          rm -rf icp r*.pem ac.zip

      - name: Compilar
        working-directory: android
        env:
          KS_B64: ${{ secrets.LUMEN_KEYSTORE_B64 }}
          LUMEN_KEYSTORE_PASS: ${{ secrets.LUMEN_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lumen.jks"; export LUMEN_KEYSTORE="$RUNNER_TEMP/lumen.jks"; fi
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease --console=plain

      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/tools/run_emulator_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-android
          path: capturas/

      - name: Conferir assinatura para publicar
        if: steps.versao.outputs.publicar == 'sim'
        env:
          KS_B64: ${{ secrets.LUMEN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Cadastre os segredos LUMEN_KEYSTORE_B64 e LUMEN_KEYSTORE_PASS no GitHub para publicar o APK."
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "LumenPDF-$VERSAO.apk"

      - name: Publicar
        if: steps.versao.outputs.publicar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $VERSAO" '$0==v{f=1;next} /^## /{f=0} f' android/CHANGELOG.md > notas.md
          gh release create "android-v$VERSAO" "LumenPDF-$VERSAO.apk" --title "Lumen PDF para Android $VERSAO" \
            --notes-file notas.md --latest=false
