name: Experimento impressora virtual
on:
  workflow_dispatch:
  push:
    paths: [".github/experimentos/impressora.py", ".github/workflows/experimento-impressora.yml"]
jobs:
  teste:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pywin32 pymupdf
      - name: Impressora por named pipe
        env: { PYTHONIOENCODING: utf-8 }
        run: python .github/experimentos/impressora.py
